<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">ISEYC institutional brand board</title>
<desc id="desc">A visual brand system showing the official ISEYC wordmark, institutional colours, four department accents and three civic intelligence products.</desc>
<defs>
 <linearGradient id="forest" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071F18"/><stop offset="1" stop-color="#123B2F"/></linearGradient>
