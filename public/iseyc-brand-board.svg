<text x="86" y="330" fill="#0B2D22" font-family="Georgia,serif" font-size="38" font-weight="700">One institution. One identity. Distinct working experiences.</text>
<text x="86" y="368" fill="#4E5D54" font-family="Arial,sans-serif" font-size="18">The official seal remains the source of truth. The system creates consistency without replacing the emblem.</text>
