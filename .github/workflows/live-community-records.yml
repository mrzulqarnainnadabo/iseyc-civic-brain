name: Live CommunityRecord Integration

on:
  push:
    branches: [chore/live-community-records-smoke]
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * *'

permissions:
  contents: read

concurrency:
  group: live-community-records-integration
  cancel-in-progress: false

jobs:
  verify-live-contract:
    name: Mandate → Civic Brain live contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify live published records and shared IDs
        run: node scripts/verify-live-community-records.mjs
