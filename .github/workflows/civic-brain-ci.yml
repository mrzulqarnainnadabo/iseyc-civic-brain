name: Civic Brain CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/civic-brief-communication, feat/community-record-consumer-v1, feat/inec-national-evidence-consumer-v1]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Generate CI-only dependency lock for audit
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Run security and acceptance checks
        run: npm test
      - name: Build production bundle
        run: npm run build
