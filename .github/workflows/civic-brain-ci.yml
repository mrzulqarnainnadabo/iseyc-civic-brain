name: Civic Brain CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/civic-brief-communication, feat/community-record-consumer-v1, feat/inec-national-evidence-consumer-v1]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Generate CI-only dependency lock for audit
        run: npm install --package-lock-only --ignore-scripts
      - name: Archive generated dependency lockfile for CI audit traceability
        uses: actions/upload-artifact@v4
        with:
          name: generated-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
      - name: Audit dependency vulnerabilities and report affected packages
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e 'const r = require("./npm-audit-report.json"); const items = Object.entries(r.vulnerabilities || {}); console.log(JSON.stringify(items.map(([name, v]) => ({ name, severity: v.severity, direct: v.isDirect, range: v.range, fixAvailable: v.fixAvailable })), null, 2)); if (items.some(([, v]) => ["high", "critical"].includes(v.severity))) process.exit(1)'
      - name: Run security and acceptance checks
        run: npm test
      - name: Build production bundle
        run: npm run build
