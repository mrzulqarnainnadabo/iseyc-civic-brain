name: Civic Brain Quality Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: civic-brain-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Security tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run security, evidence and acceptance tests
        run: npm test
      - name: Build production frontend
        run: npm run build
